<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="coinShine" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#goldGradient)" filter="url(#glow)" opacity="0.3"/>
  
  <!-- Main spinning coin -->
  <g transform="translate(50, 50)">
    <!-- Coin shadow -->
    <ellipse cx="0" cy="5" rx="30" ry="8" fill="#000" opacity="0.2"/>
    
    <!-- Coin body -->
    <circle cx="0" cy="0" r="30" fill="url(#goldGradient)" stroke="#ffaa00" stroke-width="2"/>
    
    <!-- Coin shine -->
    <ellipse cx="0" cy="-10" rx="20" ry="25" fill="url(#coinShine)"/>
    
    <!-- Dollar sign -->
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1a1a1a" text-anchor="middle">$</text>
    
    <!-- Motion lines (spinning effect) -->
    <g opacity="0.6">
      <line x1="35" y1="0" x2="42" y2="0" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
      <line x1="-35" y1="0" x2="-42" y2="0" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="35" x2="0" y2="42" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="-35" x2="0" y2="-42" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Diagonal motion lines -->
      <line x1="25" y1="-25" x2="30" y2="-30" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
      <line x1="-25" y1="25" x2="-30" y2="30" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
      <line x1="25" y1="25" x2="30" y2="30" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
      <line x1="-25" y1="-25" x2="-30" y2="-30" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Small spinning coins around -->
    <g transform="rotate(0)">
      <circle cx="0" cy="-50" r="8" fill="url(#goldGradient)" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="-46" font-family="Arial" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="middle">$</text>
    </g>
    
    <g transform="rotate(120)">
      <circle cx="0" cy="-50" r="8" fill="url(#goldGradient)" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="-46" font-family="Arial" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="middle">$</text>
    </g>
    
    <g transform="rotate(240)">
      <circle cx="0" cy="-50" r="8" fill="url(#goldGradient)" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="-46" font-family="Arial" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="middle">$</text>
    </g>
  </g>
  
  <!-- Rotating animation for main coin -->
  <animateTransform attributeName="transform" type="rotate" values="0 50 50;360 50 50" dur="4s" repeatCount="indefinite"/>
</svg>
